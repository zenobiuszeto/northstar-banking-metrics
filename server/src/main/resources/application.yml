spring:
  application:
    name: northstar-banking-metrics-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/northstar}
    username: ${DATABASE_USER:northstar}
    password: ${DATABASE_PASSWORD:northstar}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
spring.lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

northstar:
  seed:
    enabled: ${SEED_DEMO_DATA:false}
    customer-count: ${SEED_CUSTOMER_COUNT:100000}
    batch-size: ${SEED_BATCH_SIZE:1000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
